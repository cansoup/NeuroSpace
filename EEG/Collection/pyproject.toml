[project]
name = "bci-mi"
version = "0.1.0"
description = "Real-time motor imagery BCI system for 4-class EEG-based classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pylsl>=1.16.0",
    "pygame>=2.5.0",
    "pyxdf>=1.16.0",
    "brainflow>=5.21.0",
    "mne>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.ruff]
line-length = 120
target-version = "py39"
